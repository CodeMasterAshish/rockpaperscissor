<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stone Paper Scissors</title>
    <link rel="stylesheet" href="paperstonescissor.css" />
</head>
<body>

    <div class="game-container">
        <h1>🪨📄✂️ Stone Paper Scissors</h1>

        <div class="score-board">
            <div class="score">
                <p>You</p>
                <span id="human-score">0</span>
            </div>
            <div class="score">
                <p>Computer</p>
                <span id="computer-score">0</span>
            </div>
        </div>

        <h2>Choose your move</h2>

        <div class="buttons">
            <button>🪨 Rock</button>
            <button>📄 Paper</button>
            <button>✂️ Scissor</button>
        </div>

        <p class="result">Make your move 👀</p>
    </div>
    <script src="paperstonescissor.js"></script>
</body>
</html>
